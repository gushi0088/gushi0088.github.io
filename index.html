<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>吸烟计数器</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  font-family:system-ui,-apple-system,sans-serif;
  background:#f4f6f8;
  padding:24px 16px;
  color:#222;
}
.wrap{max-width:520px;margin:0 auto;}
.title{text-align:center;font-size:24px;font-weight:600;margin-bottom:6px;}
.desc{text-align:center;color:#777;font-size:14px;margin-bottom:24px}
.count-card{
  background:#2d3748;
  color:#fff;
  border-radius:22px;
  padding:36px 20px;
  text-align:center;
  margin-bottom:24px;
}
.num{font-size:80px;font-weight:bold;line-height:1}
.count-tip{opacity:0.8;font-size:15px;margin-top:8px}
.btn-row{display:flex;gap:12px;margin-bottom:20px}
button{
  flex:1;
  border:none;border-radius:16px;
  padding:18px 0;
  font-size:18px;font-weight:600;
  cursor:pointer;
}
.btn-add{background:#e53e3e;color:#fff}
.btn-reset{background:#e2e8f0;color:#444}
.cig-box{
  background:#fff;
  border-radius:18px;
  padding:20px;
  min-height:160px;
  max-height:360px;
  overflow-y:auto;
}
.cig-title{font-size:14px;color:#888;margin-bottom:14px}
.cigs{display:flex;flex-wrap:wrap;gap:10px}
.cig{
  width:46px;height:15px;
  background:linear-gradient(90deg,#f6f6f6 0 74%,#dd6b20 74%,#c53030 100%);
  border-radius:4px;
  position:relative;
  animation:pop 0.25s ease-out
}
.cig::before{
  content:"";position:absolute;left:0;top:0;bottom:0;
  width:5px;background:#777;border-radius:4px 0 0 4px;
}
@keyframes pop{
  0%{transform:scale(0.4);opacity:0}
  70%{transform:scale(1.15)}
  100%{transform:scale(1);opacity:1}
}
.empty{text-align:center;color:#bbb;padding:30px 0;font-size:14px}
.date-info{text-align:center;margin-top:20px;color:#aaa;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">每日吸烟计数器</div>
  <div class="desc">触屏点按钮 / 外接键盘按空格、回车计数</div>

  <div class="count-card">
    <div class="num" id="count">0</div>
    <div class="count-tip">今日支数</div>
  </div>

  <div class="btn-row">
    <button class="btn-add" id="btnAdd">+1 记录一支</button>
    <button class="btn-reset" id="btnReset">重置今日</button>
  </div>

  <div class="cig-box">
    <div class="cig-title">香烟记录</div>
    <div class="cigs" id="cigs"></div>
    <div class="empty" id="empty">今天还没有记录</div>
  </div>
  <div class="date-info" id="dateTxt"></div>
</div>

<script>
const STORAGE_KEY = 'smoke_cnt';
const DATE_KEY = 'smoke_day';
const countEl = document.getElementById('count');
const cigsEl = document.getElementById('cigs');
const emptyEl = document.getElementById('empty');
const dateTxt = document.getElementById('dateTxt');
const btnAdd = document.getElementById('btnAdd');
const btnReset = document.getElementById('btnReset');

function getToday(){
  const d=new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}
function load(){
  const saveDate = localStorage.getItem(DATE_KEY);
  const today = getToday();
  if(saveDate !== today){
    localStorage.setItem(STORAGE_KEY,'0');
    localStorage.setItem(DATE_KEY,today);
    return 0;
  }
  return Number(localStorage.getItem(STORAGE_KEY)||0);
}
function save(n){
  localStorage.setItem(STORAGE_KEY,n);
  localStorage.setItem(DATE_KEY,getToday());
}
function render(){
  const n = load();
  countEl.innerText = n;
  cigsEl.innerHTML = '';
  if(n===0){
    emptyEl.style.display='block';
  }else{
    emptyEl.style.display='none';
    for(let i=0;i<n;i++){
      const div = document.createElement('div');
      div.className='cig';
      cigsEl.appendChild(div);
    }
  }
  dateTxt.innerText = '日期：' + getToday();
}
function addOne(){
  let num = load();
  num++;
  save(num);
  render();
}
function reset(){
  if(confirm('确定清空今日记录？')){
    save(0);render();
  }
}
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){
    e.preventDefault();addOne();
  }
})
btnAdd.onclick = addOne;
btnReset.onclick = reset;
render();
</script>
</body>
</html>
